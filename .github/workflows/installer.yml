name: Installer

on:
  pull_request:
    paths: ["installer/**"]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: installer } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: installer } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build all targets
        run: |
          mkdir -p dist
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            out="dotfiles-${t/darwin/macos}"; [ "${t%%-*}" = windows ] && out="$out.exe"
            bun build src/index.ts --compile --target="bun-$t" --outfile "dist/$out"
          done
          (cd dist && sha256sum dotfiles-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with: { files: installer/dist/* }
